  <!-- =================================
       JAVASCRIPT
  ================================== -->

  <script>
    // VIDEO SOUND

    const video = document.getElementById("bannerVideo");

    function enableVideoSound() {
      video.muted = false;
      video.volume = 1;

      video.play().catch(() => {
        // Some browsers require user interaction.
      });

      document.removeEventListener(
        "pointerdown",
        enableVideoSound
      );
    }

    document.addEventListener(
      "pointerdown",
      enableVideoSound
    );


    // SAVE CONTACT

    document
      .getElementById("saveContact")
      .addEventListener("click", function (event) {

        event.preventDefault();

        const vCard = [
          "BEGIN:VCARD",
          "VERSION:3.0",
          "N:Tapcard;John;;;",
          "FN:JOHNTAPCARD",
          "ORG:NEAR FIELD COMMUNICATION",
          "TITLE:NFC CARDS AGENT",
          "TEL;TYPE=CELL:+639931026989",
          "EMAIL:johntapcard@gmail.com",
          "NOTE:NFC CARD BATANGAS - Batangas Branch",
          "NOTE:Facebook: Joh Tapcard",
          "NOTE:Instagram: @johntapcard",
          "NOTE:TikTok: @johntapcard",
          "END:VCARD"
        ].join("\r\n");

        const blob = new Blob(
          [vCard],
          {
            type: "text/vcard;charset=utf-8"
          }
        );

        const url = URL.createObjectURL(blob);
        const download = document.createElement("a");

        download.href = url;
        download.download = "JOHNTAPCARD.vcf";

        document.body.appendChild(download);

        download.click();
        download.remove();

        setTimeout(() => {
          URL.revokeObjectURL(url);
        }, 1000);

      });
  </script>
