<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Digital Business Card</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="profile-card">

    <!-- ================================
         VIDEO BANNER
    ================================= -->

    <section class="banner">

      <video
        id="bannerVideo"
        class="banner-video"
        autoplay
        loop
        playsinline
        preload="metadata"
      >

        <source
          src="banner.mp4"
          type="video/mp4"
        >

        Your browser does not support video.

      </video>

      <div class="banner-overlay"></div>

    </section>


    <!-- ================================
         PROFILE
    ================================= -->

    <section class="profile-section">

      <!-- PROFILE PHOTO -->

      <div class="profile-photo">

        <img
          class="profile-video"
          src="profile.png"
          alt="Profile"
        >

      </div>


      <!-- NAME -->

      <h1>
        JOHNTAPCARD
      </h1>


      <!-- JOB TITLE -->

      <p class="job-title">
        NFC DIGITAL BUSINESS CARDS
      </p>


      <!-- DESCRIPTION -->

      <p class="description">
        Why make sharing complicated?
        One tap is all it takes to connect.
      </p>


      <!-- ================================
           PHONE NUMBER
      ================================= -->

      <a
        href="tel:+639931026989"
        class="phone-number"
      >

        <span class="phone-icon">

          <img
            src="phone.png"
            alt="Phone"
          >

        </span>

        <span class="phone-text">
          +63 993 102 6989
        </span>

        <span class="arrow">
          ›
        </span>

      </a>


      <!-- ================================
           SAVE CONTACT
      ================================= -->

      <a
        href="#"
        class="save-contact"
        id="saveContact"
      >

        <span class="save-icon">
          ＋
        </span>

        <span>
          Save Contact
        </span>

      </a>


      <!-- ================================
           SOCIAL LINKS
      ================================= -->

      <div class="social-links">


        <!-- FACEBOOK -->

        <a
          href="https://www.facebook.com/profile.php?id=61594294572667"
          class="social"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span class="social-icon">

            <img
              src="facebook.png"
              alt="Facebook"
            >

          </span>

          <span class="social-name">
            Facebook
          </span>

          <span class="arrow">
            ›
          </span>

        </a>


        <!-- TIKTOK -->

        <a
          href="https://www.tiktok.com/@johntapcard"
          class="social"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span class="social-icon">

            <img
              src="tiktok.png"
              alt="TikTok"
            >

          </span>

          <span class="social-name">
            TikTok
          </span>

          <span class="arrow">
            ›
          </span>

        </a>


        <!-- INSTAGRAM -->

        <a
          href="https://www.instagram.com/johntapcard/"
          class="social"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span class="social-icon">

            <img
              src="instagram.png"
              alt="Instagram"
            >

          </span>

          <span class="social-name">
            Instagram
          </span>

          <span class="arrow">
            ›
          </span>

        </a>

      </div>


      <!-- ================================
           FOOTER
      ================================= -->

      <footer class="footer">

        <span class="powered">
          POWERED BY
        </span>

        <span class="brand">
          JOHNTAPCARD
        </span>

      </footer>

    </section>

  </main>


  <!-- ================================
       JAVASCRIPT
  ================================= -->

  <script>

    /* =================================
       VIDEO
    ================================= */

    const video =
      document.getElementById("bannerVideo");

    let videoStarted = false;


    function startVideo() {

      if (videoStarted) {
        return;
      }

      videoStarted = true;

      video.muted = false;

      video.volume = 1;

      video.play().catch(() => {

        videoStarted = false;

      });

    }


    document.addEventListener(
      "click",
      startVideo,
      {
        once: true
      }
    );


    document.addEventListener(
      "touchstart",
      startVideo,
      {
        once: true
      }
    );


    document.addEventListener(
      "pointerdown",
      startVideo,
      {
        once: true
      }
    );


    /* =================================
       SAVE CONTACT
    ================================= */

    const saveContact =
      document.getElementById("saveContact");


    saveContact.addEventListener(
      "click",
      function(event) {

        event.preventDefault();


        /* ================================
           VCARD CONTACT INFORMATION
        ================================= */

        


const vCard = [
  "BEGIN:VCARD",
  "VERSION:3.0",

  "N:Tapcard;John;;;",
  "FN:JOHNTAPCARD",
  "ORG:NEAR FIELD COMMUNICATION",
  "TITLE:NFC CARDS AGENT",

  "TEL;TYPE=CELL:+639123456789",
  "EMAIL:johntapcard@gmail.com",
  "NOTE:NFC CARD BATANGAS- Batangas Branch",
  "NOTE: FACEBOOK: Joh  Tapcard",
  "NOTE: INSTAGRAM: @johntapcard",
  "NOTE: TIKTOK: @johntapcard",
  "END:VCARD"
].join("\r\n");



        /* ================================
           CREATE VCARD FILE
        ================================= */

        const blob =
          new Blob(
            [vCard],
            {
              type: "text/vcard;charset=utf-8"
            }
          );


        const url =
          URL.createObjectURL(blob);


        /* ================================
           CREATE DOWNLOAD
        ================================= */

        const download =
          document.createElement("a");

        download.href = url;

        download.download =
          "JOHNTAPCARD.vcf";


        document.body.appendChild(download);

        download.click();

        document.body.removeChild(download);


        /* ================================
           CLEAN UP
        ================================= */

        setTimeout(function() {

          URL.revokeObjectURL(url);

        }, 1000);

      }
    );

  </script>

</body>

</html>
